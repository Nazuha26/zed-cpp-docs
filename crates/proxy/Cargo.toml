[package]
name = "zed-cpp-docs-proxy"
version = "0.3.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
url = "2"
scraper = "0.24"
tar = "0.4"
lzma-rs = "0.3"
sha2 = "0.10"
percent-encoding = "2"
