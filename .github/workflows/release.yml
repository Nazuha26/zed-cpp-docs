name: CI and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  extension:
    name: Validate and build the Zed extension
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check release versions
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tomllib

          def read(path):
              return tomllib.loads(pathlib.Path(path).read_text())

          version = read('extension.toml')['version']
          for path in ['Cargo.toml', 'crates/proxy/Cargo.toml']:
              assert read(path)['package']['version'] == version, path
          for package in read('Cargo.lock')['package']:
              if package['name'] in ['zed-cpp-docs-extension', 'zed-cpp-docs-proxy']:
                  assert package['version'] == version, package['name']
          tag = os.environ['RELEASE_TAG']
          if tag:
              assert tag == f'v{version}', (tag, version)
              assert f'## [{version}]' in pathlib.Path('CHANGELOG.md').read_text()
          PY
      - name: Set up Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt
          rustup target add wasm32-wasip2
      - run: cargo fmt --all -- --check
      - run: cargo build --locked --release --target wasm32-wasip2 -p zed-cpp-docs-extension
      - name: Prepare extension asset
        run: |
          mkdir dist
          cp target/wasm32-wasip2/release/zed_cpp_docs_extension.wasm dist/cpp-docs-extension.wasm
      - uses: actions/upload-artifact@v4
        with:
          name: release-extension
          path: dist/*
          if-no-files-found: error

  proxy:
    name: Build and test (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            executable: zed-cpp-docs-proxy.exe
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            executable: zed-cpp-docs-proxy
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Linux build and test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools clang clangd curl
      - name: Set up Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add ${{ matrix.target }}
      - run: cargo test --workspace --locked
      - run: cargo build --locked --release --target ${{ matrix.target }} -p zed-cpp-docs-proxy
      - name: Test with real clangd and a fresh documentation installation
        if: runner.os == 'Linux'
        env:
          PROXY: target/${{ matrix.target }}/release/${{ matrix.executable }}
          DOCS: ${{ runner.temp }}/cppreference
        run: |
          python tests/examples.py clang++
          python tests/integration.py "$PROXY" --clangd "$(command -v clangd)"
          python tests/failure_modes.py "$PROXY" "$(command -v clangd)"
          "$PROXY" --ensure-cppreference --data-dir "$DOCS"
          python tests/integration.py "$PROXY" --real --clangd "$(command -v clangd)" --data-dir "$DOCS"
          python tests/descriptions.py "$PROXY" "$(command -v clangd)" "$DOCS"
      - name: Package the proxy at the archive root
        env:
          TARGET: ${{ matrix.target }}
          EXECUTABLE: ${{ matrix.executable }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import tarfile
          import zipfile

          target = os.environ['TARGET']
          executable = os.environ['EXECUTABLE']
          binary = pathlib.Path('target') / target / 'release' / executable
          files = [binary, pathlib.Path('LICENSE'), pathlib.Path('THIRD_PARTY_NOTICES.md'), pathlib.Path('README.md')]
          pathlib.Path('dist').mkdir()
          base = pathlib.Path('dist') / f'zed-cpp-docs-proxy-{target}'
          if executable.endswith('.exe'):
              with zipfile.ZipFile(f'{base}.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
                  for path in files:
                      archive.write(path, path.name)
          else:
              with tarfile.open(f'{base}.tar.gz', 'w:gz') as archive:
                  for path in files:
                      archive.add(path, arcname=path.name)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [extension, proxy]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Prepare checksums and release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          import pathlib
          import re

          dist = pathlib.Path('dist')
          expected = {
              'cpp-docs-extension.wasm',
              'zed-cpp-docs-proxy-x86_64-pc-windows-msvc.zip',
              'zed-cpp-docs-proxy-x86_64-unknown-linux-musl.tar.gz',
          }
          assert {path.name for path in dist.iterdir()} == expected
          lines = [f'{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.name}\n'
                   for path in sorted(dist.iterdir())]
          (dist / 'SHA256SUMS').write_text(''.join(lines))
          version = os.environ['RELEASE_TAG'].removeprefix('v')
          changelog = pathlib.Path('CHANGELOG.md').read_text()
          section = changelog.split(f'## [{version}]', 1)[1].split('\n', 1)[1]
          notes = re.split(r'^## \[', section, maxsplit=1, flags=re.MULTILINE)[0].strip()
          assert notes
          pathlib.Path('release-notes.md').write_text(notes + '\n')
          PY
      - name: Upload all assets before publishing
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag --draft \
            --title "C/C++ Docs $RELEASE_TAG" --notes-file release-notes.md
          gh release edit "$RELEASE_TAG" --draft=false --latest
